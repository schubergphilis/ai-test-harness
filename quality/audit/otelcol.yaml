# OpenTelemetry Collector (contrib) as a local audit sink: OTLP/HTTP in, OTLP-JSON lines out.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:OTLP_PORT:-4318}   # qa/run.py shifts it per model
exporters:
  file:
    path: ${env:TRACE_FILE}
    format: json
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
