# GENERATED by scripts/registry.py from models.toml. Do not edit; run `make gen`.
# Model aliases are the only thing harnesses know about. Values come from .env.
model_list:
  - model_name: mock   # deterministic canary script (compat/mock-llm)
    litellm_params:
      model: openai/mock
      api_base: os.environ/MOCK_LLM_BASE_URL
      api_key: unused
  - model_name: sovereign   # kind: sovereign, provider: openai_compatible
    litellm_params:
      model: os.environ/SOVEREIGN_MODEL
      custom_llm_provider: openai
      api_base: os.environ/SOVEREIGN_LITELLM_BASE_URL
      api_key: os.environ/SOVEREIGN_LITELLM_API_KEY
  - model_name: anthropic   # kind: frontier, provider: openai_compatible
    litellm_params:
      model: os.environ/ANTHROPIC_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_BASE_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
  - model_name: chatgpt   # kind: frontier, provider: openai_compatible
    litellm_params:
      model: os.environ/CHATGPT_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_BASE_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
