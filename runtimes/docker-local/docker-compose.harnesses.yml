# GENERATED by scripts/registry.py from harnesses.toml. Do not edit; run `make gen`.
# Harness services; combined with docker-compose.yml (see Makefile COMPOSE).
x-agent: &agent
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on: {litellm: {condition: service_healthy}}
  environment: &agent-env
    OPENAI_BASE_URL: http://litellm:4000/v1
    OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
    MODEL: ${MODEL:-mock}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}   # empty = tracing off
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${LANGFUSE_BASIC_AUTH}
    CANARY_FIXTURE: /app/canary.json

services:
  strands:
    <<: *agent
    build: {context: ../.., dockerfile: harnesses/strands/Dockerfile}
    image: agentrt/strands:dev
    ports: ["127.0.0.1:18081:8080"]
    environment: {<<: *agent-env, OTEL_SERVICE_NAME: agent-strands}
    profiles: [strands, all]

  openai-agents:
