apiVersion: apps/v1
kind: Deployment
metadata: {name: litellm}
spec:
  selector: {matchLabels: {app: litellm}}
  template:
    metadata: {labels: {app: litellm}}
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.1
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          envFrom: [{secretRef: {name: llm-env}}]
          env: [{name: MOCK_LLM_BASE_URL, value: "http://mock-llm:4000/v1"}]
          ports: [{containerPort: 4000}]
          volumeMounts: [{name: config, mountPath: /app/config.yaml, subPath: config.yaml}]
          readinessProbe: {httpGet: {path: /health/liveliness, port: 4000}, periodSeconds: 5}
          resources: {requests: {memory: 512Mi, cpu: 100m}, limits: {memory: 1Gi}}
      volumes: [{name: config, configMap: {name: litellm-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: litellm}
spec: {selector: {app: litellm}, ports: [{port: 4000}]}
