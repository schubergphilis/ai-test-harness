apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-llm}
spec:
  selector: {matchLabels: {app: mock-llm}}
  template:
    metadata: {labels: {app: mock-llm}}
    spec:
      containers:
        - name: mock-llm
          image: agentrt/mock-llm:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 4000}]
          resources: {requests: {memory: 64Mi, cpu: 10m}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mock-llm}
spec: {selector: {app: mock-llm}, ports: [{port: 4000}]}
