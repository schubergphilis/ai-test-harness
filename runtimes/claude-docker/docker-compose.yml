# GENERATED by scripts/registry.py from harnesses.toml. Do not edit; run `make gen`.
# claude-docker runtime: claude-code on the claude-docker image (runtimes/claude-docker/Dockerfile).
# Combined with runtimes/docker-local/docker-compose.yml (see Makefile up-claude-docker).
x-agent: &agent
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on: {litellm: {condition: service_healthy}}
  environment: &agent-env
    OPENAI_BASE_URL: http://litellm:4000/v1
    OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
    MODEL: ${MODEL:-mock}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}   # empty = tracing off
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${LANGFUSE_BASIC_AUTH}
    CANARY_FIXTURE: /app/canary.json

services:
  claude-code-claude-docker:
    <<: *agent
    build: {context: ../.., dockerfile: runtimes/claude-docker/Dockerfile}
    image: agentrt/claude-code:claude-docker
    networks: [claude-docker-egress]
    environment: {<<: *agent-env, OTEL_SERVICE_NAME: agent-claude-code,
                  HOST_UID: "10001", HOST_GID: "10001"}
    profiles: [claude-docker]
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    tmpfs: [/root/.aws, /root/.config/gh, /root/.config/glab-cli, /root/.terraform.d, /root/.azure]
  claude-code-claude-docker-gw:   # inbound API port only (scripts/egress_gw.py, same image)
    build: {context: ../egress-gw}
    image: agentrt/egress-gw:dev
    ports: ["127.0.0.1:18706:8080"]
    networks: [default, claude-docker-egress]
    command: ["socat TCP-LISTEN:8080,fork,reuseaddr TCP:claude-code-claude-docker:8080"]
    depends_on: [claude-code-claude-docker]
    profiles: [claude-docker]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 32m
    pids_limit: 64
  litellm:
    networks: [default, claude-docker-egress]
  langfuse-web:
    networks: [default, claude-docker-egress]

networks:
  claude-docker-egress:
    internal: true   # no route out; only services on it are reachable
