# CI runs entirely against the deterministic mock LLM: no secrets, no paid tokens.
# Actions are pinned to commit SHAs (Dependabot keeps them current); downloaded tools are checksum-verified.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"
  OTELCOL_VERSION: "0.162.0"
  OTELCOL_SHA256: fcc063749f730f8c21fe29f2d340ff174f5f1c5885bd3156fb6c985a3036fcc3
  SYFT_VERSION: "1.54.1"
  SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
  OSV_VERSION: "2.6.0"
  OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff
        run: uvx ruff@0.16.9 check qa scripts tests compat harnesses
      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck -S warning scripts/*.sh runtimes/**/*.sh quality/*/*.sh
      - name: generated files are up to date (make gen)
        run: python3 scripts/registry.py gen --check
      - name: shared harness files have not drifted from the template
        run: |
          python3 - <<'PY'
          import filecmp, pathlib, sys
          sys.path.insert(0, "scripts")
          import registry
          ref = pathlib.Path("harnesses/_templates/python")
          if not ref.is_dir():
              ref = pathlib.Path("harnesses/strands")
          bad = [f"harnesses/{h['name']}/{f}" for h in registry.harnesses() if h["language"] == "python"
                 for f in ("app.py", "tools_canary.py")
                 if not filecmp.cmp(ref / f, pathlib.Path("harnesses", h["name"], f), shallow=False)]
          if bad:
              sys.exit(f"differs from {ref}: {', '.join(bad)}")
          print(f"shared files identical to {ref}")
          PY

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: QA tooling unit tests
        run: uv run --no-project --python 3.12 --with pytest pytest qa/tests -q

  conformance:
    # every harness x the mock model: compat contract, audit trail (OTel collector), Inspect canary, supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: install tools (otelcol-contrib, syft, osv-scanner; checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p quality/audit/bin "$HOME/.local/bin"
          curl -sSfL -o /tmp/otelcol.tgz "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          echo "${OTELCOL_SHA256}  /tmp/otelcol.tgz" | sha256sum -c -
          tar -xzf /tmp/otelcol.tgz -C quality/audit/bin otelcol-contrib
          curl -sSfL -o /tmp/syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C "$HOME/.local/bin" syft
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install node harnesses
        run: |
          for h in $(python3 scripts/registry.py names); do
            if [ "$(python3 scripts/registry.py get "$h" language)" = node ]; then
              (cd "harnesses/$h" && npm ci --no-audit --no-fund && npm run -s build)
            fi
          done
      - name: start mock LLM + litellm (no .env -> only the mock alias is usable)
        run: scripts/native.sh up
      - name: QA run (mock)
        run: python3 qa/run.py --models mock --suites conformance,audit,inspect,supply --epochs 1
      - name: logs on failure
        if: failure()
        run: tail -n 50 .run/*.log runs/*/mock/proc/*.log 2>/dev/null || true
      - name: stop
        if: always()
        run: scripts/native.sh down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa-run-mock
          path: |
            runs/*/run.json
            runs/*/report.html
          if-no-files-found: warn

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
      - name: osv-scanner (all lockfiles)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          # known, accepted findings are documented in qa/known_findings.json; report them here without failing
          /tmp/osv-scanner scan source -r . || echo "::warning::osv-scanner reported vulnerabilities (see log)"

  images:
    name: docker (${{ matrix.image }})
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.setup.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image == 'mock-llm' && 'compat/mock-llm/Dockerfile' || format('harnesses/{0}/Dockerfile', matrix.image) }}
          platforms: linux/amd64
          push: false
          tags: agentrt/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  setup:
    # harness list comes from harnesses.toml, so new harnesses get an image build automatically
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          python3 -c 'import json,sys; sys.path.insert(0,"scripts"); import registry; print("images="+json.dumps(registry.names()+["mock-llm"]))' >> "$GITHUB_OUTPUT"
