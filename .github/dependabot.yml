# GENERATED by scripts/registry.py from harnesses.toml. Do not edit; run `make gen`.
# Weekly, grouped dependency updates; CI's conformance job validates them against the mock LLM.
version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /harnesses/strands
      - /harnesses/openai-agents
      - /harnesses/langgraph
      - /harnesses/pydantic-ai
      - /tests
      - /quality/inspect
      - /quality/audit
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 10
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /harnesses/pi
    schedule: {interval: weekly, day: monday}
    groups:
      node:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /harnesses/strands
      - /harnesses/openai-agents
      - /harnesses/langgraph
      - /harnesses/pydantic-ai
      - /harnesses/pi
      - /compat/mock-llm
    schedule: {interval: weekly, day: monday}
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /runtimes/docker-local
    schedule: {interval: weekly, day: monday}
    groups:
      compose-images:
        patterns: ["*"]
